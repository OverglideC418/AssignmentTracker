services:
  unysync:
    build: .
    container_name: unysync
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      UNISYNC_DB: /app/data/unysync.db
      UNISYNC_TIMEZONE: ${UNISYNC_TIMEZONE:-America/Denver}
      UNISYNC_SECURE_COOKIE: ${UNISYNC_SECURE_COOKIE:-0}
    volumes:
      - unysync-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  unysync-data:
