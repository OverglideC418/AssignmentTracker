services:
  assignmenttracker:
    build: .
    container_name: assignmenttracker
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ASSIGNMENTTRACKER_DB: /app/data/assignmenttracker.db
      ASSIGNMENTTRACKER_TIMEZONE: ${ASSIGNMENTTRACKER_TIMEZONE:-America/Denver}
      ASSIGNMENTTRACKER_SECURE_COOKIE: ${ASSIGNMENTTRACKER_SECURE_COOKIE:-0}
    volumes:
      - assignmenttracker-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  assignmenttracker-data:
    # Keep the existing volume name by default so a rebrand does not hide prior data.
    name: ${ASSIGNMENTTRACKER_VOLUME_NAME:-unysync-data}
